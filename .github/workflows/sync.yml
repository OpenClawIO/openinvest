name: Daily Flex sync

on:
  schedule:
    # 02:00 UTC Tue–Sat ≈ after the US cash close Mon–Fri, with Flex lag.
    - cron: "0 2 * * 2-6"
  workflow_dispatch:
    inputs:
      period_days:
        description: Flex lookback in days (1–365). Empty uses the saved query period.
        required: false
        default: "90"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install
        run: npm ci

      - name: Pull Flex snapshot
        run: npm run sync
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
          IBKR_FLEX_PERIOD_DAYS: ${{ github.event.inputs.period_days }}

      - name: Commit public snapshot
        run: |
          git add data/public.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public Flex snapshot"
          git push

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "1"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
